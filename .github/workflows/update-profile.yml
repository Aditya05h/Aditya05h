name: Update profile activity

"on":
  schedule:
    - cron: "17 2 * * *" # Daily at approximately 07:47 IST.
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-profile.yml"
      - "scripts/update_contributions.py"
      - "scripts/render_art.py"

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Fetch and render public contributions
        run: python scripts/update_contributions.py --username Aditya05h
      - name: Commit updated activity
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/contributions.svg assets/stats.svg data/contributions.json
          if git diff --cached --quiet; then
            echo 'Activity artwork is already current.'
            exit 0
          fi
          git commit -m 'chore: refresh profile activity [skip ci]'
          git push
