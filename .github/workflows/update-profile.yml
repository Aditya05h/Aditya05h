name: Update profile activity

"on":
  schedule:
    - cron: "17 * * * *" # Hourly; GitHub may delay scheduled runs.
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-profile.yml"
      - "scripts/update_contributions.py"
      - "scripts/render_art.py"
      - "scripts/test_activity.py"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Fetch and render public contributions
        run: python scripts/update_contributions.py --username Aditya05h
      - name: Validate contribution totals and artwork
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Commit updated activity
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/contributions.svg assets/stats.svg data/contributions.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh profile activity [skip ci]'
          fi
          # Immutable commit URLs bypass the raw-file/CDN cache for branch URLs.
          python scripts/update_contributions.py --render-only --image-revision "$(git rev-parse HEAD)"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore: link verified activity snapshot [skip ci]'
          fi
          git push
